name: validate-skills

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: List discoverable skills
        run: npx -y skills add . --list

      - name: Smoke install all catalog skills in a temp workspace
        shell: bash
        run: |
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          cd "$tmpdir"
          for skill_dir in "$GITHUB_WORKSPACE"/skills/*; do
            [ -d "$skill_dir" ] || continue
            skill="$(basename "$skill_dir")"
            echo "Smoke installing skill: $skill"
            npx -y skills add "$GITHUB_WORKSPACE" --skill "$skill" -a universal -y
          done
