name: validate-skills

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: List discoverable skills
        run: npx -y skills add . --list

      - name: Smoke install a stable skill in a temp workspace
        shell: bash
        run: |
          tmpdir="$(mktemp -d)"
          cd "$tmpdir"
          npx -y skills add "$GITHUB_WORKSPACE" --skill simple-code -a universal -y
